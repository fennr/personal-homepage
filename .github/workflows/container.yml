# Проверка и образ. Тег vX.Y.Z публикует образ в GHCR; обычный push только
# проверяет, что сборка проходит.
name: Container

on:
  pull_request:
  push:
    branches: [master, main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Тулчейн обновляется на месте: сторонних actions для Rust не берём.
      - name: Подготовить Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy
          cargo --version
          rustc --version

      - name: Кэш зависимостей
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  build:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Версия одна и живёт в Cargo.toml: тег обязан с ней совпадать, иначе
      # образ уедет под чужим номером.
      - name: Сверить версию с тегом
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - "${GITHUB_REF_NAME#v}" <<'PY'
          import pathlib
          import sys
          import tomllib

          expected = sys.argv[1]
          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"]
          if version != expected:
              raise SystemExit(
                  f"тег v{expected} не совпадает с версией в Cargo.toml {version!r}"
              )
          PY

      - uses: docker/setup-buildx-action@v4

      - name: Войти в GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Теги образа
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
