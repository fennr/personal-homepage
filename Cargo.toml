[package]
name = "personal-homepage"
version = "0.3.0"
edition = "2024"
# Let-chains в проверках контента требуют 1.88.
rust-version = "1.88"

[dependencies]
askama = "0.16.1"
axum = "0.8.9"
chrono = "0.4.45"
include_dir = "0.7.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "time"] }
toml = "1.2.1"
tower-http = { version = "0.7.1", features = ["compression-gzip", "compression-br"] }

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
