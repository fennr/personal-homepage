<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ page.name }} — {{ page.role }}{% endblock %}</title>
<meta name="description" content="{{ page.summary }}">
<meta name="theme-color" content="{% block theme_color %}#F1F2EE{% endblock %}">
<meta name="color-scheme" content="{% block color_scheme %}light{% endblock %}">
<meta property="og:type" content="profile">
<meta property="og:locale" content="ru_RU">
<meta property="og:site_name" content="fennr.ru">
<meta property="og:title" content="{% block og_title %}{{ page.name }}{% endblock %}">
<meta property="og:description" content="{{ page.summary }}">
<meta property="og:url" content="{% block og_url %}https://fennr.ru/{% endblock %}">
<meta property="og:image" content="https://fennr.ru/static/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ page.name }} — {{ page.role }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="{% block canonical %}https://fennr.ru/{% endblock %}">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
{# Шрифт грузится до первой отрисовки: без preload он приезжает только после
   разбора CSS, и текст успевает мигнуть системным. #}
{% block preload %}{% endblock %}
{% block styles %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% block content %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
